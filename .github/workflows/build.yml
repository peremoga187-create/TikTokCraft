name: Build TikTokCraft + DroidMedia
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - name: Build libdroidmedia.so
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          for ABI in arm64-v8a x86_64; do
            cmake -S src/main/cpp -B build-$ABI -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
            cmake --build build-$ABI -j$(nproc)
          done
          mkdir -p src/main/resources/natives/android-arm64 src/main/resources/natives/android-x86_64
          cp build-arm64-v8a/libdroidmedia.so src/main/resources/natives/android-arm64/
          cp build-x86_64/libdroidmedia.so src/main/resources/natives/android-x86_64/
      - name: Build Fabric Mod JAR
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: tiktokcraft-1.21.11
          path: build/libs/*.jar
